# Source registry for the Health Data Safety Framework (HDSF).
# Every rule cites sources by id.
#
# type:     law | law-pending | proposal | guidance | standard | literature | news | policy
# status:   free text, always with a date, so readers know how current it is.
# verified: date the entry (status and url) was last checked by a maintainer, or "pending" when it still needs a
#           check. framework/legislation.md lists pending entries first. Do not rely on a pending entry.

sources:
  # ------------------------------------------------------------------ data protection
  - id: GDPR
    title: "Regulation (EU) 2016/679, General Data Protection Regulation"
    type: law
    jurisdiction: EU
    status: "In force since 25 May 2018. Data concerning health, genetic and biometric data are special categories (Art. 9): processing is banned unless an Art. 9(2) condition applies, for example explicit consent (a), health or social care (h), public health (i) or research (j). DPIA (Art. 35), data protection by design (Art. 25), security (Art. 32), child consent for information society services (Art. 8)"
    url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
    verified: 2026-11-22

  - id: CJEU-LINDEN
    title: "CJEU, C-21/23, Lindenapotheke, 4 Oct 2024"
    type: law
    jurisdiction: EU
    status: "Case law (Grand Chamber). Data customers enter when ordering pharmacy-only medicines online are data concerning health under Art. 9(1) GDPR, even without a prescription, where a link can be made between the product, its use and an identifiable person; certainty is not needed. Competitors can sue under unfair competition law"
    url: "https://curia.europa.eu/jcms/upload/docs/application/pdf/2024-10/cp240159en.pdf"
    verified: 2026-11-22

  - id: DSA
    title: "Regulation (EU) 2022/2065, Digital Services Act"
    type: law
    jurisdiction: EU
    status: "Fully applicable since 17 Feb 2024. Online platforms may not show ads based on profiling with special categories of data such as health (Art. 26(3)) and may not use dark patterns (Art. 25)"
    url: "https://eur-lex.europa.eu/eli/reg/2022/2065/oj"
    verified: 2026-11-11

  - id: EPRIV
    title: "Directive 2002/58/EC, ePrivacy Directive, Art. 5(3)"
    type: law
    jurisdiction: EU
    status: "In force. Storing or reading information on a user's device needs consent unless strictly necessary for the service the user asked for"
    url: "https://eur-lex.europa.eu/eli/dir/2002/58/oj"
    verified: 2026-11-22

  - id: EDPB-ART53
    title: "EDPB Guidelines 2/2023 on Technical Scope of Art. 5(3) of ePrivacy Directive, version 2.0"
    type: guidance
    jurisdiction: EU
    status: "Adopted 7 Oct 2024 after public consultation. Art. 5(3) covers any storage of or access to information on the device, not only cookies: local storage, tracking pixels, URL tracking, unique identifiers and fingerprinting"
    url: "https://www.edpb.europa.eu/system/files/2024-10/edpb_guidelines_202302_technical_scope_art_53_eprivacydirective_v2_en_0.pdf"
    verified: 2026-11-19

  - id: EDPB-PSEUDO
    title: "EDPB Guidelines 01/2025 on Pseudonymisation"
    type: guidance
    jurisdiction: EU
    status: "Adopted 16 Jan 2025 for public consultation. Pseudonymised data remain personal data for whoever can attribute them with additional information kept separately"
    url: "https://edpb.europa.eu/news/news/2025/edpb-adopts-pseudonymisation-guidelines-and-paves-way-improve-cooperation_en"
    verified: 2026-11-19

  - id: CJEU-SRB
    title: "CJEU, C-413/23 P, EDPS v Single Resolution Board, 4 Sep 2025 (EU:C:2025:645)"
    type: law
    jurisdiction: EU
    status: "Case law. Pseudonymised data stay personal for the controller that holds the key; for a recipient with no means reasonably likely to re-identify, they may not be personal data. The controller must name such recipients when it collects the data"
    url: "https://curia.europa.eu/juris/liste.jsf?num=C-413/23%20P"
    verified: 2026-11-19

  - id: EDPB-RESEARCH
    title: "EDPB Guidelines 1/2026 on processing of personal data for scientific research purposes"
    type: guidance
    jurisdiction: EU
    status: "Adopted for public consultation in April 2026 (listed 16 Apr 2026). Not final: health research groups asked for more on registries, real-world evidence and federated research. Watched"
    url: "https://www.edpb.europa.eu/our-work-tools/our-documents/topic/health_en"
    verified: 2026-11-22

  - id: EDPB-EDPS-EHDS
    title: "EDPB-EDPS Joint Opinion 03/2022 on the Proposal for a Regulation on the European Health Data Space"
    type: guidance
    jurisdiction: EU
    status: "Adopted 12 Jul 2022 on the proposal. Recommended excluding wellness applications and wellness data from mandatory secondary use, or making that use subject to prior consent"
    url: "https://www.edpb.europa.eu/system/files/2022-07/edpb_edps_jointopinion_202203_europeanhealthdataspace_en.pdf"
    verified: 2026-11-22

  - id: OMNIBUS-DATA
    title: "Digital Omnibus Regulation proposal, COM(2025) 837, procedure 2025/0360(COD)"
    type: proposal
    jurisdiction: EU
    status: "Proposed 19 Nov 2025. Would make the definition of personal data relative to the holder and move device-storage consent into a new GDPR Art. 88a. EDPB-EDPS Joint Opinion 2/2026 calls the definition change a red line. Watched; HDSF relies on neither change"
    url: "https://www.europarl.europa.eu/legislative-train/theme-a-new-plan-for-europe-s-sustainable-prosperity-and-competitiveness/file-digital-package"
    verified: 2026-11-19

  # ------------------------------------------------------------------ health data space
  - id: EHDS
    title: "Regulation (EU) 2025/327 on the European Health Data Space"
    type: law-pending
    jurisdiction: EU
    status: "In force 26 Mar 2025; applies in stages: general date 26 Mar 2027, further milestones 26 Mar 2029, 2031 and 2035 (check the date for each chapter). Primary use: people's access to and control over their electronic health data; exchange of patient summaries and ePrescriptions in all Member States from 2029. EHR systems must meet Annex II (interoperability and logging components). A wellness application that claims interoperability with EHR systems must meet the same requirements, inform users, carry a label (Art. 47) and be registered in the EU database (Art. 49); interoperability never means automatic sharing (Art. 48). Secondary use covers data from wellness applications too"
    url: "https://eur-lex.europa.eu/eli/reg/2025/327/oj"
    notes: "Commission page and timeline: https://health.ec.europa.eu/ehealth-digital-health-and-care/european-health-data-space-regulation-ehds_en"
    verified: 2026-11-22

  - id: EDPB-AIMODELS
    title: "EDPB Opinion 28/2024 on certain data protection aspects related to the processing of personal data in the context of AI models"
    type: guidance
    jurisdiction: EU
    status: "Adopted 17 Dec 2024. When an AI model can be considered anonymous (high bar, case by case); how to use legitimate interest for developing and deploying models (three-step test); effects of unlawful training data on later use. Does not cover Art. 9 special categories"
    url: "https://edpb.europa.eu/system/files/2024-12/edpb_opinion_202428_ai-models_en.pdf"
    verified: 2026-11-23

  - id: EDPB-SCRAPE
    title: "EDPB Guidelines 03/2026 on web scraping in the context of generative AI"
    type: guidance
    jurisdiction: EU
    status: "Adopted 8 Jul 2026 for public consultation (until 30 Oct 2026); not final. Scraping that includes special categories needs both an Art. 6 basis and an Art. 9(2) exception; purpose limitation and transparency need particular attention; scrape only from reliable sources, record timestamps, validate data"
    url: "https://www.edpb.europa.eu/news/edpb-sheds-light-on-anonymisation-and-web-scraping-for-generative-ai-and-adopts-final-version_en"
    verified: 2026-11-23

  - id: EDPB-ANON
    title: "EDPB Guidelines on anonymisation (2026)"
    type: guidance
    jurisdiction: EU
    status: "Adopted 8 Jul 2026 for public consultation (until 30 Oct 2026); not final. Clarifies when data can be considered anonymous and gives a framework to check whether anonymisation worked"
    url: "https://www.edpb.europa.eu/news/edpb-sheds-light-on-anonymisation-and-web-scraping-for-generative-ai-and-adopts-final-version_en"
    verified: 2026-11-23

  - id: EDPB-DECEPTIVE
    title: "EDPB Guidelines 03/2022 on deceptive design patterns in social media platform interfaces: how to recognise and avoid them, version 2.0"
    type: guidance
    jurisdiction: EU
    status: "Final version adopted 14 Feb 2023 after consultation. Written for social media but its categories of deceptive patterns (overloading, skipping, stirring, obstructing, fickle, left in the dark) apply to any consent and privacy interface"
    url: "https://www.edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-032022-deceptive-design-patterns-social-media_en"
    verified: 2026-11-23

  - id: EDPB-CONSENT
    title: "EDPB Guidelines 05/2020 on consent under Regulation 2016/679"
    type: guidance
    jurisdiction: EU
    status: "Adopted May 2020. Freely given, specific, informed, unambiguous consent; explicit consent for Art. 9; no consent walls; withdrawal as easy as giving consent"
    url: "https://www.edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-052020-consent-under-regulation-2016679_en"
    verified: pending

  - id: EDPB-DPBD
    title: "EDPB Guidelines 4/2019 on Article 25 Data Protection by Design and by Default, version 2.0"
    type: guidance
    jurisdiction: EU
    status: "Adopted Oct 2020. How to build data protection into design choices and defaults"
    url: "https://www.edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-42019-article-25-data-protection-design-and_en"
    verified: pending

  - id: WHO-LMM
    title: "WHO, Ethics and governance of artificial intelligence for health: guidance on large multi-modal models (ISBN 978-92-4-008475-9)"
    type: guidance
    jurisdiction: international
    status: "Published 18 Jan 2024. Over 40 recommendations for governments, technology companies and health care providers on generative AI in health: transparency, testing with intended users, limits of use, accountability, equity"
    url: "https://www.who.int/publications-detail-redirect/9789240084759"
    verified: 2026-11-23

  - id: EC-REC-EHRXF
    title: "Commission Recommendation (EU) 2019/243 of 6 February 2019 on a European Electronic Health Record exchange format"
    type: guidance
    jurisdiction: EU
    status: "Recommendation (not binding), OJ L 39, 11.2.2019. Principles and baseline technical specifications for a European EHR exchange format (patient summaries, ePrescriptions, lab results, images, discharge reports); now taken further by the EHDS"
    url: "https://eur-lex.europa.eu/eli/reco/2019/243/oj"
    verified: 2026-11-23

  - id: EC-CLEAR
    title: "European Commission, How to write clearly (Clear writing for Europe)"
    type: guidance
    jurisdiction: EU
    status: "Current. The Commission's plain language guide, in 24 official languages: think of the reader, short sentences, active verbs, no jargon"
    url: "https://commission.europa.eu/about-european-commission/departments-and-executive-agencies/translation/clear-writing-europe_en"
    verified: 2026-11-23

  - id: OP-PLAIN
    title: "Publications Office of the EU, Web Guide: Plain language and Easy-to-read"
    type: guidance
    jurisdiction: EU
    status: "Last updated 7 Oct 2026. Recommendations for plain language for the general public and Easy-to-read for people with intellectual or learning disabilities, low literacy or cognitive disabilities: simple words, explain difficult ones, active voice, literal wording"
    url: "https://op.europa.eu/en/web/webguide/plain-language-and-easy-to-read"
    verified: 2026-11-23

  # ------------------------------------------------------------------ medical devices
  - id: MDR
    title: "Regulation (EU) 2017/745 on medical devices (MDR)"
    type: law
    jurisdiction: EU
    status: "Applies since 26 May 2021. Software with a medical intended purpose is a medical device (Art. 2(1)); Annex VIII Rule 11 classifies software. Clinical evaluation (Art. 61), quality management and post-market surveillance (Art. 10, 83 to 86), vigilance (Art. 87). Transitional periods for legacy devices were extended by Regulation (EU) 2023/607"
    url: "https://eur-lex.europa.eu/eli/reg/2017/745/oj"
    verified: pending

  - id: IVDR
    title: "Regulation (EU) 2017/746 on in vitro diagnostic medical devices (IVDR)"
    type: law
    jurisdiction: EU
    status: "Applies since 26 May 2022, with transitional periods extended by later amendments. Software that analyses data from samples (blood, tissue, lab values) for a medical purpose falls under the IVDR"
    url: "https://eur-lex.europa.eu/eli/reg/2017/746/oj"
    verified: pending

  - id: MDCG-2019-11
    title: "MDCG 2019-11 rev. 1, Guidance on qualification and classification of software in Regulation (EU) 2017/745 (MDR) and Regulation (EU) 2017/746 (IVDR)"
    type: guidance
    jurisdiction: EU
    status: "Revision 1 published 17 Jun 2025. Qualification depends on the intended purpose the manufacturer claims, not on how the software works. Adds medical device artificial intelligence (MDAI), modular software, disease-prevention software under Rule 11, Annex XVI products and links to the EHDS"
    url: "https://health.ec.europa.eu/latest-updates/update-mdcg-2019-11-rev1-qualification-and-classification-software-regulation-eu-2017745-and-2025-06-17_en"
    verified: 2026-11-22

  - id: MDCG-2025-4
    title: "MDCG 2025-4, Guidance on the safe making available of medical device software (MDSW) apps on online platforms"
    type: guidance
    jurisdiction: EU
    status: "Published 16 Jun 2025. Uploading a medical device app to a platform is placing it on the market. Users should see the device information before download; platforms should keep medical device apps apart from wellness and lifestyle apps. Covers MDR, IVDR and DSA roles"
    url: "https://health.ec.europa.eu/medical-devices-sector/new-regulations/guidance-mdcg-endorsed-documents-and-other-guidance_en"
    verified: 2026-11-22

  - id: MDCG-2025-6
    title: "MDCG 2025-6 / AIB 2025-1, FAQ on the interplay between the MDR and IVDR and the Artificial Intelligence Act"
    type: guidance
    jurisdiction: EU
    status: "Published 19 Jun 2025, the first joint guidance of the MDCG and the AI Board. AI that is a medical device, or a safety component of one, and needs a notified body is a high-risk AI system under AI Act Art. 6(1); the AI Act does not change the MDR or IVDR class. An MDR user is not automatically an AI Act deployer"
    url: "https://health.ec.europa.eu/latest-updates/mdcg-2025-6-faq-interplay-between-medical-devices-regulation-vitro-diagnostic-medical-devices-2025-06-19_en"
    verified: 2026-11-22

  - id: MDCG-2020-1
    title: "MDCG 2020-1, Guidance on clinical evaluation (MDR) and performance evaluation (IVDR) of medical device software"
    type: guidance
    jurisdiction: EU
    status: "Published March 2020. Valid clinical association, technical performance and clinical performance as the three parts of the evidence for software"
    url: "https://health.ec.europa.eu/medical-devices-sector/new-regulations/guidance-mdcg-endorsed-documents-and-other-guidance_en"
    verified: pending

  - id: MDR-REV
    title: "Proposal for a targeted revision of the MDR and IVDR, COM(2025) 1023, procedure 2025/0404(COD)"
    type: proposal
    jurisdiction: EU
    status: "Adopted by the Commission 16 Dec 2025. Would amend the MDR, the IVDR, Regulation (EU) 2022/123 and the AI Act, including MDR classification rules and software classification. With Parliament and Council in 2026 (Council compromise texts circulating). Watched"
    url: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0404(COD)"
    verified: 2026-11-22

  # ------------------------------------------------------------------ AI
  - id: AIA
    title: "Regulation (EU) 2024/1689, Artificial Intelligence Act"
    type: law
    jurisdiction: EU
    status: "Prohibitions (Art. 5) and AI literacy (Art. 4) apply since 2 Feb 2025. GPAI rules since 2 Aug 2025. Transparency (Art. 50) from 2 Aug 2026; machine-readable marks by 2 Dec 2026 for systems already on the market. As amended by the AI Omnibus: high-risk rules for Annex III use cases from 2 Dec 2027, and for AI in products under Annex I law (medical devices and IVDs included) from 2 Aug 2028"
    url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    notes: "Timeline as stated by the Commission's AI Act page (last updated 19 Oct 2026): https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
    verified: 2026-11-22

  - id: AIA-OMNIBUS
    title: "Digital Omnibus on AI: Regulation amending the AI Act (reported as Regulation (EU) 2026/1744)"
    type: law
    jurisdiction: EU
    status: "In force 27 Jul 2026. Annex III high-risk obligations from 2 Dec 2027; Annex I (AI in regulated products, medical devices included) from 2 Aug 2028. Adds prohibition 9 (non-consensual intimate content and CSAM) from December 2026"
    url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
    verified: 2026-11-22

  - id: AIA-GL-ART50
    title: "Commission Guidelines on transparency obligations for providers and deployers of AI systems (Art. 50 AI Act)"
    type: guidance
    jurisdiction: EU
    status: "Published 20 Jul 2026; obligations apply from 2 Aug 2026. Chatbots, AI agents and avatars disclose from the first interaction, clearly and accessibly; the 'obvious' exception is read restrictively. Synthetic media carries machine-readable marks"
    url: "https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems"
    verified: 2026-11-22

  - id: AIA-GL-PROHIB
    title: "Commission Guidelines on prohibited artificial intelligence practices established by Regulation (EU) 2024/1689 (AI Act), C(2025) 884"
    type: guidance
    jurisdiction: EU
    status: "Published 4 Feb 2025. Not binding; examples for Art. 5, including harmful manipulation and exploitation of vulnerability due to age, disability or a social or economic situation"
    url: "https://digital-strategy.ec.europa.eu/en/library/commission-publishes-guidelines-prohibited-artificial-intelligence-ai-practices-defined-ai-act"
    verified: 2026-11-22

  # ------------------------------------------------------------------ security, products, data
  - id: NIS2
    title: "Directive (EU) 2022/2555 (NIS2)"
    type: law
    jurisdiction: EU
    status: "Transposition deadline 17 Oct 2024. Health is a sector of high criticality (Annex I): healthcare providers, EU reference laboratories, research and manufacture of pharmaceuticals, and manufacturers of medical devices considered critical in a public health emergency, among others. Risk management, incident reporting and management-body accountability"
    url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
    verified: pending

  - id: PT-NIS2
    title: "Decreto-Lei n.º 125/2025, de 4 de dezembro (Regime Jurídico da Cibersegurança) and Regulamento n.º 756/2026"
    type: law
    jurisdiction: PT
    status: "Transposes NIS2 in Portugal. Published 4 Dec 2025; in force 3 Apr 2026. CNCS regulation n.º 756/2026 (22 Jun 2026) sets the technical and reporting details. Personal liability of management bodies for intent or gross negligence"
    url: "https://diariodarepublica.pt/dr/detalhe/decreto-lei/125-2025-962603401"
    verified: 2026-11-22

  - id: CRA
    title: "Regulation (EU) 2024/2847, Cyber Resilience Act"
    type: law-pending
    jurisdiction: EU
    status: "Reporting obligations from 11 Sep 2026; main obligations from 11 Dec 2027. Products covered by the MDR or IVDR are outside its scope; connected wellness devices and apps with a remote data processing part are generally in scope. The EHDS amends it"
    url: "https://eur-lex.europa.eu/eli/reg/2024/2847/oj"
    verified: 2026-11-11

  - id: DATA-ACT
    title: "Regulation (EU) 2023/2854, Data Act"
    type: law
    jurisdiction: EU
    status: "Applies from 12 Sep 2025. Users of connected products (wearables, connected health devices) and related services can access and share the data they generate (Art. 4 and 5); products placed on the market from 12 Sep 2026 must make that data accessible by design (Art. 3(1)). Switching rules for data processing services (Chapter VI)"
    url: "https://eur-lex.europa.eu/eli/reg/2023/2854/oj"
    verified: pending

  - id: PLD
    title: "Directive (EU) 2024/2853 on liability for defective products"
    type: law-pending
    jurisdiction: EU
    status: "Applies to products placed on the market from 9 Dec 2026. Software, including AI systems and apps, is a product; damage includes medically recognised psychological harm and destruction or corruption of data. Missing security updates can make a product defective"
    url: "https://eur-lex.europa.eu/eli/dir/2024/2853/oj"
    verified: pending

  - id: WAD
    title: "Directive (EU) 2016/2102 on the accessibility of the websites and mobile applications of public sector bodies"
    type: law
    jurisdiction: EU
    status: "In force; mobile apps covered since 23 Jun 2021. Applies to public hospitals, health services and other public sector bodies; requires EN 301 549 conformance and an accessibility statement"
    url: "https://eur-lex.europa.eu/eli/dir/2016/2102/oj"
    verified: pending

  - id: EAA
    title: "Directive (EU) 2019/882, European Accessibility Act"
    type: law
    jurisdiction: EU
    status: "Applies since 28 Jun 2025, to listed products and services such as e-commerce, consumer banking and e-books. Covers a health service when it is sold as one of those services, for example online sales of health products"
    url: "https://eur-lex.europa.eu/eli/dir/2019/882/oj"
    verified: 2026-11-11

  # ------------------------------------------------------------------ Portugal
  - id: PT-LEI-58-2019
    title: "Lei n.º 58/2019, de 8 de agosto (execução do RGPD)"
    type: law
    jurisdiction: PT
    status: "In force. Art. 29 sets rules for health and genetic data: access on a need-to-know basis, by professionals bound by secrecy; Art. 17 covers data of deceased people; criminal offences for misuse (Art. 46 ff.)"
    url: "https://diariodarepublica.pt/dr/detalhe/lei/58-2019-123815982"
    verified: 2026-11-22

  - id: PT-LEI-12-2005
    title: "Lei n.º 12/2005, de 26 de janeiro (informação genética pessoal e informação de saúde)"
    type: law
    jurisdiction: PT
    status: "In force, as amended by Lei n.º 26/2016. Health information belongs to the person (Art. 3); only health professionals may access the clinical record (Art. 5); backups and confidentiality of health information systems (Art. 4)"
    url: "https://diariodarepublica.pt/dr/detalhe/lei/12-2005-624463"
    verified: 2026-11-22

  # ------------------------------------------------------------------ standards
  - id: ISO-82304-2
    title: "ISO/TS 82304-2:2021, Health software, Part 2: Health and wellness apps, Quality and reliability"
    type: standard
    jurisdiction: international
    status: "Published July 2021; reviewed and confirmed 2025. Quality requirements for health apps and a health app quality label; does not decide whether an app is a medical device. The EU Label2Enable project built an assessment scheme on it"
    url: "https://www.iso.org/standard/78182.html"
    verified: 2026-11-22

  - id: IEC-82304-1
    title: "IEC 82304-1:2016, Health software, Part 1: General requirements for product safety"
    type: standard
    jurisdiction: international
    status: "Published 2016. Safety and security requirements for standalone health software"
    url: "https://webstore.iec.ch/"
    verified: pending

  - id: IEC-62304
    title: "IEC 62304, Medical device software, Software life cycle processes"
    type: standard
    jurisdiction: international
    status: "Harmonised standard for medical device software life cycles (edition 1 with amendment 1, 2015)"
    url: "https://webstore.iec.ch/"
    verified: pending

  - id: ISO-14971
    title: "ISO 14971:2019, Medical devices, Application of risk management to medical devices"
    type: standard
    jurisdiction: international
    status: "Harmonised standard for medical device risk management"
    url: "https://www.iso.org/standard/72704.html"
    verified: pending

  - id: ISO-13485
    title: "ISO 13485:2016, Medical devices, Quality management systems"
    type: standard
    jurisdiction: international
    status: "Harmonised standard for quality management of medical device manufacturers"
    url: "https://www.iso.org/standard/59752.html"
    verified: pending

  - id: ISO-27799
    title: "ISO 27799, Health informatics, Information security management in health using ISO/IEC 27002"
    type: standard
    jurisdiction: international
    status: "Guidance for applying ISO/IEC 27002 controls to personal health information. Use the current edition"
    url: "https://www.iso.org/search.html?q=27799"
    verified: pending

  - id: HL7-FHIR
    title: "HL7 FHIR (Fast Healthcare Interoperability Resources)"
    type: standard
    jurisdiction: international
    status: "Open standard for exchanging health data through APIs; basis of many national and EU exchange specifications"
    url: "https://hl7.org/fhir/"
    verified: pending

  - id: IEC-62366-1
    title: "IEC 62366-1, Medical devices, Part 1: Application of usability engineering to medical devices"
    type: standard
    jurisdiction: international
    status: "Harmonised standard for usability engineering of medical devices: use specification, use-related risk analysis, formative and summative evaluation"
    url: "https://webstore.iec.ch/"
    verified: pending

  - id: EN301549
    title: "EN 301 549, Accessibility requirements for ICT products and services"
    type: standard
    jurisdiction: EU
    status: "Harmonised European standard. Use the current version referenced in the Official Journal"
    url: "https://www.etsi.org/standards"
    verified: 2026-11-11

  - id: WCAG22
    title: "W3C Web Content Accessibility Guidelines (WCAG) 2.2"
    type: standard
    jurisdiction: international
    status: "W3C Recommendation"
    url: "https://www.w3.org/TR/WCAG22/"
    verified: 2026-11-11

  # ------------------------------------------------------------------ evidence
  - id: R-TANGARI2021
    title: "Tangari G, Ikram M, Ijaz K, Kaafar MA, Berkovsky S. Mobile health and privacy: cross sectional study. BMJ 2021;373:n1248"
    type: literature
    jurisdiction: international
    status: "Peer reviewed. 20,991 mHealth apps on Google Play; 15,838 free apps analysed in depth. 28.1% had no privacy policy, and only 47% of user data transmissions matched the policy"
